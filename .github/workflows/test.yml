name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
      - name: Check syntax
        run: |
          python -m compileall core runtimes orchestration memory toolkit infrastructure interfaces services main.py -q
      - name: Run tests
        env:
          LLM_MOCK_MODE: "true"
        run: python -m pytest tests.py -q
