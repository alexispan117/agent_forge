# ═══════════════════════════════════════════════
# AgentForge 配置
# 密钥一律走环境变量（${VAR} 由 core.config.load_config 展开），
# 真实值写在本地 .env（不入库），模板见 .env.example
# ═══════════════════════════════════════════════

# ── 搜索引擎 ──
# 可选: baidu（推荐）/ duckduckgo（免费，国内网络可能受限）
engine: baidu

# 百度千帆 AI 搜索 API Key
baidu_api_key: "${BAIDU_API_KEY}"

# ── LLM（对话/摘要）──
llm:
  enabled: true
  api_key: "${LLM_API_KEY}"
  base_url: "https://api.deepseek.com"
  model: "deepseek-v4-flash"

# ── Embedding（向量检索，用于 RAG 语义搜索）──
# 阿里百炼 DashScope Embedding API（OpenAI 兼容）
embedding:
  api_key: "${DASHSCOPE_API_KEY}"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "text-embedding-v3"
