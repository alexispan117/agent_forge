{% extends "base.html" %}
{% block content %}
<div class="chat-container">
    <div id="chatBox" style="flex:1;overflow-y:auto;padding:16px;"></div>
    <div class="chat-input-row">
        <input class="input" id="chatInput" type="text" placeholder="输入你的问题…"
               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
        <button class="btn" id="sendBtn" onclick="sendMessage()">发送</button>
        <button class="btn btn-ghost" onclick="resetChat()">重置</button>
        <span id="chatStatus" style="font-size:12px;color:var(--text-muted);"></span>
    </div>
</div>

<script>
const initialHistory = {{ history_json|safe }};
const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const chatStatus = document.getElementById('chatStatus');

function appendMessage(role, content, msgId) {
    const div = document.createElement('div');
    div.className = 'chat-message ' + role;
    div.innerHTML = `<div class="chat-bubble">${content}</div>`;
    if (role === 'assistant' && msgId) {
        const fb = document.createElement('div');
        fb.style.cssText = 'margin-top:6px;font-size:12px;color:var(--text-muted);display:flex;gap:16px;';
        fb.innerHTML = `<span onclick="feedback('${msgId}',1)" style="cursor:pointer;">👍 有用</span>
                        <span onclick="feedback('${msgId}',-1)" style="cursor:pointer;">👎 没用</span>`;
        div.appendChild(fb);
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function feedback(msgId, rating) {
    await fetch('/feedback', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({message_id:msgId, rating:String(rating)}),
    });
}

async function sendMessage() {
    const q = chatInput.value.trim();
    if (!q) return;
    appendMessage('user', q);
    chatInput.value = '';
    chatStatus.textContent = '思考中…';
    sendBtn.disabled = true;

    const r = await fetch('/agent/chat/run', {
        method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({query:q}),
    });
    const text = await r.text();
    const m = text.match(/<div[^>]*id="chat-result[^>]*>([\s\S]*?)<\/div>/);
    if (m) {
        const data = JSON.parse(m[1]);
        appendMessage('assistant', data.answer || data.error, data.message_id);
    }
    chatStatus.textContent = '';
    sendBtn.disabled = false;
}

async function resetChat() {
    chatBox.innerHTML = '';
    chatStatus.textContent = '重置中…';
    await fetch('/agent/chat/run', {method:'POST', credentials:'same-origin',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: new URLSearchParams({query:'',reset:'true'})});
    chatStatus.textContent = '';
}

for (const msg of initialHistory) {
    appendMessage(msg.role, msg.content);
}
</script>
{% endblock %}
